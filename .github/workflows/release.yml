# On every push to main: with pending changesets, open or update the "Version packages" PR; once that PR is merged
# (no changesets left, versions not yet on npm), pack, publish with npm trusted publishing (OIDC, no token) and
# create the GitHub releases and tags. Follows https://changesets.dev/guide/automating.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No dependency cache in release jobs: a poisoned cache must not reach a publish.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
      - id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
      - uses: changesets/action/version@v2.1.2
        with:
          script: pnpm version-packages
          pr-title: Version packages
          commit-message: Version packages

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
      - run: vp exec playwright install --with-deps chromium
      # The full gate, so nothing is published that `pnpm verify` would reject; it also builds `dist`.
      - run: pnpm verify
      - id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GitHub releases and tags
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
      - uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
